<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- highlight.js theme is bundled and injected dynamically per
		     light/dark theme — see src/routes/+layout.svelte — rather than a
		     hardcoded CDN link, which was always dark and version-skewed
		     from the pinned dependency besides. -->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
